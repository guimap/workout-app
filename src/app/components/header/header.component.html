<header class="header">
    <button class="btn-back" (click)="onBack()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
        <span>Voltar</span>
    </button>

    <div class="header-info">
        <div class="title-container">
            <h1 #titleEl tabindex="0" (mouseenter)="checkTruncationAndShow(titleEl)" (mouseleave)="hideTooltip()"
                (focus)="checkTruncationAndShow(titleEl)" (blur)="hideTooltip()" (touchstart)="onTouchStart(titleEl)"
                (touchend)="onTouchEnd()" (click)="toggleTooltip(titleEl)"
                [attr.aria-describedby]="showTooltip ? 'title-tooltip' : null">
                {{ title }}
            </h1>
            @if (showTooltip) {
            <div id="title-tooltip" role="tooltip" class="title-tooltip visible">
                {{ title }}
            </div>
            }
        </div>
        <p class="text-muted">{{ completedCount }} de {{ totalCount }} exercícios @if (volume) { • Vol: <strong>{{
                volume }}</strong> }</p>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" [style.width.%]="progressPercentage"></div>
        </div>
    </div>

    <div class="header-actions">
        <!-- Toggle Unit Button -->
        <button class="unit-toggle-btn" (click)="settingsService.toggleUnit()">
            <span [class.active]="settingsService.unitSignal() === 'kg'">kg</span>
            <span class="unit-separator">/</span>
            <span [class.active]="settingsService.unitSignal() === 'lb'">lb</span>
        </button>

        @if (showTimer) {
        <div class="timer-badge">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
                <path d="M12 6V12L16 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            <span>{{ timer }}</span>
        </div>
        }
    </div>
</header>
