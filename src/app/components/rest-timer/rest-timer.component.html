@if (restTimerService.isVisible()) {
<div class="rest-timer-container animate-slideUp">
    <div class="rest-timer-card">
        <div class="timer-display">
            <span class="timer-label text-muted">Descanso</span>
            <span class="timer-value" [class.ended]="restTimerService.timeRemaining() === 0">
                {{ formattedTime() }}
            </span>
        </div>

        <div class="timer-actions">
            <button class="btn-icon" (click)="togglePlayPause()" [disabled]="restTimerService.timeRemaining() === 0">
                @if (restTimerService.isRunning()) {
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="6" y="4" width="4" height="16"></rect>
                    <rect x="14" y="4" width="4" height="16"></rect>
                </svg>
                } @else {
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                }
            </button>
            <button class="btn-action-text" (click)="add30s()">+30s</button>
            <button class="btn-icon skip-btn" (click)="close()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
    </div>
</div>
}
